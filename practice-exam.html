<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Security+ SY0-701 Practice Exam</title>
<style>
  :root{
    --bg:#0d1117;
    --panel:#151b23;
    --panel-2:#1c2430;
    --border:#2a3441;
    --text:#e6edf3;
    --text-dim:#8b96a5;
    --amber:#e3a008;
    --amber-dim:#3d3116;
    --teal:#2dd4bf;
    --teal-dim:#12302c;
    --red:#f87171;
    --red-dim:#3a1d1d;
    --green:#4ade80;
    --green-dim:#173521;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    padding:24px 16px 60px;
  }
  .wrap{max-width:780px;margin:0 auto;}
  header{margin-bottom:20px;}
  .eyebrow{
    font-family:"SFMono-Regular",Consolas,"Liberation Mono",Menlo,monospace;
    font-size:12px;letter-spacing:.08em;color:var(--amber);text-transform:uppercase;
  }
  h1{font-size:22px;font-weight:600;margin:4px 0 2px;}
  .sub{color:var(--text-dim);font-size:14px;margin:0;}
  footer{margin-top:28px;text-align:center;}
  footer a{color:var(--teal);text-decoration:none;font-size:12px;margin:0 8px;}

  .setup{
    background:var(--panel);border:1px solid var(--border);border-radius:12px;
    padding:20px;margin-bottom:20px;
  }
  .setup h2{font-size:15px;margin:0 0 12px;color:var(--text);}
  .domain-grid{display:flex;flex-direction:column;gap:8px;margin-bottom:16px;}
  .domain-row{
    display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;
    border:1px solid var(--border);background:var(--panel-2);cursor:pointer;user-select:none;
  }
  .domain-row.checked{border-color:var(--amber);background:var(--amber-dim);}
  .domain-row input{accent-color:var(--amber);width:16px;height:16px;flex-shrink:0;}
  .domain-row .dlabel{font-size:13.5px;flex:1;}
  .domain-row .dcount{font-family:"SFMono-Regular",Consolas,monospace;font-size:11px;color:var(--text-dim);}

  .row-inline{display:flex;gap:8px;align-items:center;margin-bottom:14px;flex-wrap:wrap;}
  select{
    font-family:inherit;font-size:14px;background:var(--panel-2);color:var(--text);
    border:1px solid var(--border);border-radius:8px;padding:8px 10px;
  }
  label.inline-label{font-size:13px;color:var(--text-dim);}

  button{
    font-family:inherit;font-size:14px;border-radius:8px;border:1px solid var(--border);
    background:var(--panel-2);color:var(--text);padding:10px 16px;cursor:pointer;
  }
  .btn-primary{background:var(--amber-dim);border-color:var(--amber);color:var(--amber);font-weight:600;}
  .btn-check{border-color:var(--amber);color:var(--amber);}
  .btn-reset{color:var(--text-dim);}
  .btn-select-all{font-size:12px;padding:6px 10px;color:var(--teal);border-color:var(--teal);}

  .score-bar{
    position:sticky;top:0;background:var(--bg);padding:10px 0;margin-bottom:14px;
    display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--text-dim);
    border-bottom:1px solid var(--border);z-index:5;
  }
  .score-bar b{color:var(--amber);}

  .qcard{
    background:var(--panel);border:1px solid var(--border);border-radius:12px;
    padding:20px;margin-bottom:16px;
  }
  .qhead{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px;gap:8px;flex-wrap:wrap;}
  .qnum{font-family:"SFMono-Regular",Consolas,monospace;font-size:12px;color:var(--teal);letter-spacing:.05em;text-transform:uppercase;}
  .qdomain{font-size:11px;color:var(--text-dim);border:1px solid var(--border);padding:3px 8px;border-radius:6px;}
  .qtext{font-size:15px;line-height:1.5;margin-bottom:14px;color:var(--text);}

  .opt-list{display:flex;flex-direction:column;gap:8px;margin-bottom:14px;}
  .opt{
    font-size:13.5px;padding:10px 12px;border-radius:8px;border:1px solid var(--border);
    background:var(--panel-2);cursor:pointer;user-select:none;display:flex;gap:10px;align-items:flex-start;
  }
  .opt .marker{
    flex-shrink:0;width:18px;height:18px;border-radius:50%;border:2px solid var(--text-dim);
    margin-top:1px;
  }
  .opt.selected{border-color:var(--amber);background:var(--amber-dim);}
  .opt.selected .marker{border-color:var(--amber);background:var(--amber);}
  .opt.correct{border-color:var(--green);color:var(--green);background:var(--green-dim);}
  .opt.correct .marker{border-color:var(--green);background:var(--green);}
  .opt.incorrect{border-color:var(--red);color:var(--red);background:var(--red-dim);}
  .opt.incorrect .marker{border-color:var(--red);background:var(--red);}

  .actions{display:flex;gap:8px;margin-top:4px;}
  .result{margin-top:12px;padding:12px 14px;border-radius:8px;font-size:13.5px;line-height:1.5;display:none;}
  .result.show{display:block;}
  .result.pass{background:var(--green-dim);border:1px solid var(--green);color:var(--green);}
  .result.fail{background:var(--red-dim);border:1px solid var(--red);color:var(--red);}
  .result .explain{color:var(--text);margin-top:8px;}

  .summary{
    background:var(--panel);border:1px solid var(--amber);border-radius:12px;
    padding:22px;text-align:center;margin-bottom:20px;
  }
  .summary .big{font-size:36px;font-weight:700;color:var(--amber);margin:6px 0;}
  .summary .breakdown{margin-top:14px;text-align:left;font-size:13px;color:var(--text-dim);}
  .summary .breakdown div{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid var(--border);}

  #examArea{display:none;}
  #setupArea.hidden, #examArea.hidden{display:none;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow">CompTIA Security+ // SY0-701</div>
    <h1>Practice Exam</h1>
    <p class="sub">Pulled from every domain in this repo. Pick one domain to drill, or combine several for a mixed exam.</p>
  </header>

  <div class="setup" id="setupArea">
    <h2>1. Choose domains</h2>
    <div class="row-inline">
      <button class="btn-select-all" id="selectAllBtn">Select all</button>
      <button class="btn-select-all" id="selectNoneBtn">Clear</button>
    </div>
    <div class="domain-grid" id="domainGrid"></div>

    <h2>2. How many questions?</h2>
    <div class="row-inline">
      <select id="countSelect">
        <option value="10">10 questions</option>
        <option value="20">20 questions</option>
        <option value="40">40 questions</option>
        <option value="all">All matching questions</option>
      </select>
      <label class="inline-label"><input type="checkbox" id="shuffleCheck" checked style="accent-color:var(--amber);"> Shuffle order</label>
    </div>

    <button class="btn-primary" id="generateBtn">Generate Practice Exam</button>
  </div>

  <div id="examArea">
    <div class="score-bar">
      <div>Score: <b id="scoreLabel">0/0</b> checked</div>
      <div><button class="btn-reset" id="backToSetupBtn">&larr; Change domains</button></div>
    </div>
    <div id="questions"></div>
    <div id="summaryWrap"></div>
    <div class="row-inline">
      <button class="btn-reset" id="resetExamBtn">Reset this exam</button>
    </div>
  </div>

  <footer>
    <a href="./flashcards.html">Flashcards</a> · <a href="./pbq-practice.html">PBQ Practice</a>
  </footer>
</div>

<script>
const DOMAINS = [
  {id:1, label:"Domain 1 — General Security Concepts", covers:"1.1–1.4"},
  {id:2, label:"Domain 2 — Threats, Vulnerabilities & Mitigations", covers:"2.1–2.5"},
  {id:3, label:"Domain 3 — Security Architecture", covers:"3.1–3.4"},
  {id:4, label:"Domain 4 — Security Operations", covers:"4.1–4.9"},
  {id:5, label:"Domain 5 — Security Program Management & Oversight", covers:"5.1–5.6"}
];

const QUESTIONS = [
// ===================== DOMAIN 1 =====================
{domain:1, sub:"1.1", q:"A firewall that filters traffic based on rules is best classified as which type of control?", options:["Managerial","Technical","Physical","Operational"], answer:1, explain:"Firewalls, encryption, and other technology-based safeguards are technical controls."},
{domain:1, sub:"1.1", q:"An organization requires all employees to complete security awareness training. Which control category does this fall under?", options:["Physical","Technical","Operational","Managerial"], answer:2, explain:"Security awareness training is an operational control — it's carried out by people as part of day-to-day operations, not enforced by technology or high-level policy alone."},
{domain:1, sub:"1.1", q:"A system can't be patched immediately, so the security team adds extra monitoring and restricts network access to it in the meantime. What kind of control is this?", options:["Corrective","Compensating","Deterrent","Directive"], answer:1, explain:"A compensating control is an alternative measure used when the primary control (patching) isn't currently possible."},
{domain:1, sub:"1.1", q:"Warning signage and visible security cameras are examples of which control type?", options:["Detective","Deterrent","Preventive","Corrective"], answer:1, explain:"Deterrent controls discourage an attacker from acting without directly stopping them."},
{domain:1, sub:"1.2", q:"Which security model operates on the principle of 'never trust, always verify,' regardless of whether a request originates inside or outside the network?", options:["Defense in depth","Zero Trust","Least privilege","Federation"], answer:1, explain:"Zero Trust assumes no implicit trust for any user or device, continuously verifying every request."},
{domain:1, sub:"1.2", q:"In a Zero Trust architecture, which component actually makes the decision to grant or deny a request based on policy?", options:["Policy enforcement point","Policy engine","RADIUS server","Data plane"], answer:1, explain:"The policy engine evaluates the request against policy and threat intelligence to make the adjudication decision; the policy enforcement point then carries that decision out."},
{domain:1, sub:"1.2", q:"Which AAA protocol was developed as the modern successor to RADIUS?", options:["TACACS+","Diameter","Kerberos","SAML"], answer:1, explain:"Diameter was built to work with more modern hardware and support additional authentication methods than RADIUS."},
{domain:1, sub:"1.2", q:"An organization wants to separate authentication, authorization, and accounting into distinct processes for managing admin access to network switches. Which protocol best fits?", options:["RADIUS","Diameter","TACACS+","OAuth"], answer:2, explain:"TACACS+ was developed by Cisco specifically to separate AAA functions and is commonly used for administrative access to network devices."},
{domain:1, sub:"1.2", q:"A fake file named 'passwords.xlsx' is planted on a file server specifically to detect unauthorized access. This is an example of what?", options:["Honeypot","Honeynet","Honeyfile","Honeytoken"], answer:2, explain:"A honeyfile is a decoy file planted to trigger an alert when accessed, since a legitimate user would have no reason to open it."},
{domain:1, sub:"1.3", q:"Which change management document describes the steps to revert a change if something goes wrong?", options:["Standard operating procedure","Backout plan","Impact analysis","Maintenance window"], answer:1, explain:"A backout plan is the documented procedure for reversing a change if it causes problems."},
{domain:1, sub:"1.3", q:"What is the primary purpose of a Change Advisory Board (CAB)?", options:["To physically secure the data center","To review and approve changes that could affect security","To manage vendor contracts","To perform vulnerability scans"], answer:1, explain:"A CAB reviews proposed changes to ensure they're implemented in a controlled, documented way rather than ad hoc."},
{domain:1, sub:"1.4", q:"Which key must be used to decrypt data that was encrypted with a recipient's public key?", options:["The sender's public key","The recipient's private key","The recipient's public key","A shared symmetric key"], answer:1, explain:"In asymmetric encryption, only the matching private key can decrypt data encrypted with its public key."},
{domain:1, sub:"1.4", q:"Which method allows a client to check a specific certificate's revocation status in real time, without downloading an entire list?", options:["CRL","OCSP","CSR","CA"], answer:1, explain:"OCSP (Online Certificate Status Protocol) checks a single certificate's status on demand, unlike a downloaded CRL."},
{domain:1, sub:"1.4", q:"What technique defeats rainbow table attacks against stored password hashes?", options:["Key stretching alone","Salting","Tokenization","Data masking"], answer:1, explain:"Salting adds random data before hashing so identical passwords produce different hashes, defeating precomputed rainbow tables."},

// ===================== DOMAIN 2 =====================
{domain:2, sub:"2.1", q:"Which threat actor type is most likely to rely on pre-built tools or scripts written by others, rather than developing their own exploits?", options:["Nation-state","Unskilled attacker","Organized crime","Insider threat"], answer:1, explain:"An unskilled attacker (sometimes called a 'script kiddie') typically lacks the technical skill to write custom tools."},
{domain:2, sub:"2.1", q:"A former employee uses lingering account access to steal company data out of resentment. This is best classified as which combination of actor and motivation?", options:["Nation-state / espionage","Insider threat / revenge","Hacktivist / political belief","Organized crime / financial gain"], answer:1, explain:"An insider threat is a current or former employee misusing legitimate access; revenge is a common motivation in these cases."},
{domain:2, sub:"2.1", q:"Employees using an unapproved cloud storage app without IT's knowledge is an example of what?", options:["Shadow IT","Organized crime","Hacktivism","Insider threat"], answer:0, explain:"Shadow IT refers to technology used within an organization without IT's knowledge or approval, creating unmanaged risk."},
{domain:2, sub:"2.2", q:"An attacker leaves infected USB drives in a company parking lot, hoping an employee plugs one in. This is an example of which threat vector?", options:["Message-based","Removable device","Voice call","Supply chain"], answer:1, explain:"Removable media like USB drives can introduce malware directly, bypassing network-based defenses."},
{domain:2, sub:"2.2", q:"Registering the domain 'arnaz0n.com' to catch users who mistype 'amazon.com' is an example of what technique?", options:["Typosquatting","Watering hole attack","Brand impersonation","Pretexting"], answer:0, explain:"Typosquatting relies on common misspellings of legitimate domains to catch mistyped URLs."},
{domain:2, sub:"2.2", q:"Why are MSPs (Managed Service Providers) considered a significant supply chain risk?", options:["They never patch their own systems","A compromise on their end can expose every client they manage","They only work with government agencies","They don't use privileged access"], answer:1, explain:"MSPs are often given privileged access to manage client systems, so a single MSP compromise can cascade across all their clients."},
{domain:2, sub:"2.3", q:"A flaw where a resource is checked for permissions and then used, but conditions change in between, is known as what?", options:["Buffer overflow","TOC/TOU (race condition)","Memory injection","Zero-day"], answer:1, explain:"Time-of-Check to Time-of-Use (TOC/TOU) is a specific race condition exploiting the gap between checking and using a resource."},
{domain:2, sub:"2.3", q:"An attacker breaks out of an isolated virtual machine to access the underlying hypervisor or other VMs. What is this called?", options:["VM sprawl","VM escape","Resource reuse","Containerization flaw"], answer:1, explain:"VM escape is when an attacker breaks the isolation boundary of a VM to reach the host or other VMs."},
{domain:2, sub:"2.3", q:"A misconfigured, publicly exposed cloud storage bucket is an example of which vulnerability category?", options:["Hardware vulnerability","Cloud-specific vulnerability","Zero-day vulnerability","Cryptographic vulnerability"], answer:1, explain:"Misconfigured storage is one of the most common cloud-specific vulnerabilities."},
{domain:2, sub:"2.4", q:"Malicious code that lies dormant until a specific date or event triggers it is called a:", options:["Logic bomb","Worm","Rootkit","Keylogger"], answer:0, explain:"A logic bomb activates only when a specific condition or trigger is met."},
{domain:2, sub:"2.4", q:"Which password attack tries one common password against many different accounts to avoid triggering account lockout?", options:["Brute force","Dictionary attack","Password spraying","Rainbow table attack"], answer:2, explain:"Password spraying spreads a small number of guesses across many accounts rather than repeatedly attacking one account."},
{domain:2, sub:"2.4", q:"Using a stolen password hash directly to authenticate, without ever cracking it back into plaintext, is called:", options:["Pass-the-hash attack","Collision attack","Birthday attack","SSL stripping"], answer:0, explain:"A pass-the-hash attack uses the hash itself for authentication, bypassing the need to know the plaintext password."},
{domain:2, sub:"2.4", q:"A user logs in from New York and, five minutes later, from a location that would require impossible travel speed to reach. What indicator does this represent?", options:["Concurrent session usage","Impossible travel","Resource consumption","Out-of-cycle logging"], answer:1, explain:"Impossible travel flags logins from geographically distant locations faster than physically possible, indicating compromised credentials."},
{domain:2, sub:"2.5", q:"Which mitigation approach explicitly permits only a defined list of approved applications to run, blocking everything else by default?", options:["Application block list","Application allow list","ACL","Isolation"], answer:1, explain:"An allow list is a restrictive, default-deny approach — only explicitly approved applications are permitted."},
{domain:2, sub:"2.5", q:"What does the principle of least privilege state?", options:["All users should have admin rights by default","Users should have only the minimum access necessary for their role","Access should be reviewed once a year","Only IT staff need access controls"], answer:1, explain:"Least privilege limits damage from a compromised account by granting only the access actually needed."},
{domain:2, sub:"2.5", q:"What capability does SOAR add on top of what a SIEM already provides?", options:["Log aggregation","Automated, orchestrated response playbooks","Vulnerability scanning","Endpoint encryption"], answer:1, explain:"SIEM focuses on aggregating and correlating logs; SOAR adds automation to actually respond to what's detected."},

// ===================== DOMAIN 3 =====================
{domain:3, sub:"3.1", q:"In the cloud shared responsibility model for an IaaS deployment, who is generally responsible for securing the physical data center?", options:["The customer","The cloud provider","Both equally, with no distinction","Neither — it's outsourced further"], answer:1, explain:"In IaaS, the provider is responsible for the underlying physical infrastructure; the customer manages OS, apps, and data on top of it."},
{domain:3, sub:"3.1", q:"Which cloud service model gives the customer control over the operating system and applications, while the provider manages only the underlying hardware/virtualization?", options:["SaaS","PaaS","IaaS","DaaS"], answer:2, explain:"IaaS provides raw infrastructure; the customer manages everything from the OS up."},
{domain:3, sub:"3.1", q:"In Software-Defined Networking (SDN), which plane actually forwards traffic according to the decisions handed down by the control plane?", options:["Management plane","Data plane","Control plane","Application plane"], answer:1, explain:"The data plane carries out the forwarding decisions made by the control plane."},
{domain:3, sub:"3.1", q:"Microservices architectures tend to increase an application's attack surface primarily because of:", options:["Slower development cycles","More APIs and service-to-service communication paths","The use of a single monolithic codebase","Reduced scalability"], answer:1, explain:"Breaking an app into many small services multiplies the number of communication paths and APIs that need to be secured."},
{domain:3, sub:"3.2", q:"Which type of firewall specifically inspects HTTP/HTTPS traffic to block attacks like SQL injection and XSS?", options:["Layer 4 firewall","UTM","WAF","Stateless firewall"], answer:2, explain:"A Web Application Firewall (WAF) operates at Layer 7 and understands web-specific attack patterns."},
{domain:3, sub:"3.2", q:"If a security appliance configured to 'fail closed' crashes, what happens to traffic passing through it?", options:["All traffic is allowed through","All traffic is blocked","Only encrypted traffic is blocked","Traffic is rerouted automatically"], answer:1, explain:"Fail-closed prioritizes security over availability — if the device fails, it blocks everything rather than letting traffic through unchecked."},
{domain:3, sub:"3.2", q:"Which IPSec component provides confidentiality (encryption) in addition to integrity and authentication?", options:["AH (Authentication Header)","ESP (Encapsulating Security Payload)","IKE","SAE"], answer:1, explain:"ESP encrypts the payload as well as authenticating it; AH only provides integrity/authentication, not encryption."},
{domain:3, sub:"3.2", q:"Which load balancing feature ensures a specific client's requests keep going to the same backend server?", options:["DNS round robin","Least utilized host","Affinity (session persistence)","Active/passive failover"], answer:2, explain:"Affinity, also called session persistence, keeps a client tied to the same server to preserve session state."},
{domain:3, sub:"3.3", q:"Which U.S. regulation specifically protects health information (PHI)?", options:["GLBA","HIPAA","SOX","CCPA"], answer:1, explain:"HIPAA governs the protection of patient health information in the United States."},
{domain:3, sub:"3.3", q:"Data actively being processed in a system's memory is considered to be in which state?", options:["Data at rest","Data in transit","Data in use","Data in escrow"], answer:2, explain:"Data in use is actively being processed in memory, and is generally the hardest state to protect."},
{domain:3, sub:"3.4", q:"Which backup type requires only the last full backup plus one additional file to fully restore?", options:["Incremental","Differential","Snapshot","Journaling"], answer:1, explain:"A differential backup captures everything changed since the last full backup, so restoring only needs the full backup plus the latest differential."},
{domain:3, sub:"3.4", q:"Which cloud data replication method protects against a full regional disaster, not just a single data center failure?", options:["LRS","ZRS","GRS","None of these protect against regional disasters"], answer:2, explain:"GRS (Geo-Redundant Storage) replicates data to a second, geographically distant region."},
{domain:3, sub:"3.4", q:"In a server cluster, which component specifically helps prevent a 'split-brain' scenario where two nodes both believe they're active?", options:["Virtual IP","Witness server","Heartbeat communication","Quorum disk"], answer:1, explain:"A witness server helps the cluster determine which node should be active, preventing conflicting nodes from both acting as primary."},

// ===================== DOMAIN 4 =====================
{domain:4, sub:"4.1", q:"Which hardening baseline standard is published by DISA and commonly required in government/military environments?", options:["CIS Benchmark","STIG","SCAP","OVAL"], answer:1, explain:"STIGs (Security Technical Implementation Guides) are DISA-published configuration standards used heavily in government/military settings."},
{domain:4, sub:"4.1", q:"In which mobile device deployment model does the company own the device but allow the employee to use it for personal purposes as well?", options:["BYOD","CYOD","COPE","MDM"], answer:2, explain:"COPE (Corporate-Owned, Personally Enabled) means the company owns the device but allows personal use."},
{domain:4, sub:"4.1", q:"Which WPA3 feature replaces the WPA2 four-way handshake to resist offline dictionary attacks?", options:["PMF","SAE","EAP-TLS","Wi-Fi Easy Connect"], answer:1, explain:"SAE (Simultaneous Authentication of Equals) is the key exchange method in WPA3-Personal that resists offline dictionary attacks."},
{domain:4, sub:"4.2", q:"What process provides documented, third-party-verified proof that data destruction was performed correctly?", options:["Sanitization","Certification","Enumeration","Classification"], answer:1, explain:"Certification of destruction provides documented proof supporting compliance and audit requirements."},
{domain:4, sub:"4.3", q:"Which type of vulnerability scan uses valid login credentials to get a deeper, more accurate view of a system's weaknesses?", options:["Non-credentialed scan","Credentialed scan","Passive scan","Black-box scan"], answer:1, explain:"A credentialed scan logs into the target, providing deeper visibility than an external, non-credentialed scan."},
{domain:4, sub:"4.3", q:"What does a CVSS score represent?", options:["A unique identifier for a specific vulnerability","A standardized 0–10 severity rating for a vulnerability","A list of revoked certificates","A vendor's patch release schedule"], answer:1, explain:"CVSS (Common Vulnerability Scoring System) is a standardized severity score used to help prioritize remediation."},
{domain:4, sub:"4.3", q:"Which penetration testing environment gives testers no prior knowledge of the target, simulating a real external attacker?", options:["Known environment (white box)","Partially known environment (gray box)","Unknown environment (black box)","Integrated (purple team)"], answer:2, explain:"An unknown/black-box test gives testers zero advance knowledge, closest to a genuine outside attacker's perspective."},
{domain:4, sub:"4.4", q:"What is the key functional difference between a NIDS and a NIPS?", options:["NIDS blocks traffic in real time; NIPS only alerts","NIPS can actively block traffic inline; NIDS can only detect and alert","They are identical, just different vendor names","NIDS only works on wireless networks"], answer:1, explain:"A NIPS sits inline and can actively block malicious traffic, while a NIDS is passive and can only detect and alert."},
{domain:4, sub:"4.4", q:"Which SNMP component sends an unsolicited alert to the manager when a significant event occurs, rather than waiting to be polled?", options:["SNMP agent","SNMP trap","NMS","MIB"], answer:1, explain:"An SNMP trap is sent proactively by the agent to report a significant event immediately."},
{domain:4, sub:"4.5", q:"Which type of firewall tracks the full context of a connection and automatically allows return traffic tied to an already-permitted session?", options:["Stateless firewall","Stateful firewall","WAF","UTM"], answer:1, explain:"A stateful firewall tracks connection state, so it doesn't need a separate rule for every possible reply."},
{domain:4, sub:"4.5", q:"During the TCP three-way handshake, what is the second step?", options:["SYN","SYN-ACK","ACK","FIN"], answer:1, explain:"The handshake is SYN (client) → SYN-ACK (server) → ACK (client), completing the connection."},
{domain:4, sub:"4.5", q:"Which port range is used for temporary, ephemeral client-side connections?", options:["0–1023","1024–49151","49152–65535","1–20"], answer:2, explain:"Dynamic/private ports (49152–65535) are used temporarily by client applications for outbound connections."},
{domain:4, sub:"4.5", q:"Which secure protocol replaces insecure Telnet for encrypted remote command-line access?", options:["FTP","SSH","SNMP","HTTP"], answer:1, explain:"SSH provides encrypted remote terminal access, replacing plaintext Telnet."},
{domain:4, sub:"4.5", q:"Which email security record tells a receiving mail server what to do with messages that fail SPF or DKIM checks?", options:["SPF","DKIM","DMARC","S/MIME"], answer:2, explain:"DMARC builds on SPF and DKIM by specifying the policy (quarantine/reject) for messages that fail those checks."},
{domain:4, sub:"4.6", q:"Which access control model uses security labels/classifications and gives users no discretion over permissions?", options:["DAC","RBAC","MAC","ABAC"], answer:2, explain:"Mandatory Access Control (MAC) enforces access centrally through classifications, without user discretion."},
{domain:4, sub:"4.6", q:"In biometric authentication, what does the Crossover Error Rate (CER) represent?", options:["The rate of unauthorized users incorrectly accepted","The rate of authorized users incorrectly rejected","The point where FAR and FRR are equal","The maximum number of failed login attempts allowed"], answer:2, explain:"CER is the point where the False Acceptance Rate and False Rejection Rate intersect; a lower CER means a more accurate system."},
{domain:4, sub:"4.6", q:"Which PAM technique grants elevated access only for the specific time window it's actually needed?", options:["Password vaulting","Just-in-time (JIT) permissions","Ephemeral credentials","Federation"], answer:1, explain:"JIT permissions grant privileged access temporarily rather than leaving it standing indefinitely."},
{domain:4, sub:"4.7", q:"What risk does an organization introduce by heavily automating infrastructure management through a single central platform?", options:["Reduced consistency","A single point of failure","Slower deployment","Increased manual workload"], answer:1, explain:"If the central automation platform fails or is compromised, everything it manages can be affected at once."},
{domain:4, sub:"4.8", q:"In the incident response lifecycle, which phase comes immediately after containment?", options:["Detection","Eradication","Preparation","Lessons learned"], answer:1, explain:"The order is Preparation → Detection/Analysis → Containment → Eradication → Recovery → Lessons Learned."},
{domain:4, sub:"4.8", q:"What documentation proves that evidence wasn't altered from the moment it was collected through the entire investigation?", options:["Legal hold","Chain of custody","E-discovery","Root cause analysis"], answer:1, explain:"Chain of custody is the documented record of who handled evidence and when, required for it to hold up legally."},
{domain:4, sub:"4.9", q:"Which data source provides a full recording of raw network traffic, down to the individual packet?", options:["Firewall logs","Packet captures","Dashboards","Automated reports"], answer:1, explain:"Packet captures record the actual raw traffic exchanged between systems, unlike summarized log data."},

// ===================== DOMAIN 5 =====================
{domain:5, sub:"5.1", q:"Which international standard defines the requirements for establishing and maintaining an Information Security Management System (ISMS)?", options:["ISO 27002","ISO 27001","NIST SP 800-53","PCI DSS"], answer:1, explain:"ISO 27001 defines the requirements for an ISMS; ISO 27002 provides supporting best-practice guidance."},
{domain:5, sub:"5.1", q:"Under privacy terminology like GDPR, who decides why and how personal data is processed?", options:["Data processor","Data custodian","Data controller","Data steward"], answer:2, explain:"The data controller makes the decisions about why and how personal data is processed."},
{domain:5, sub:"5.2", q:"How is Annualized Loss Expectancy (ALE) calculated?", options:["Asset Value x Exposure Factor","SLE x ARO","RTO x RPO","MTTR x MTBF"], answer:1, explain:"ALE = SLE (Single Loss Expectancy) x ARO (Annualized Rate of Occurrence)."},
{domain:5, sub:"5.2", q:"Which term describes an organization's overall attitude toward risk-taking (e.g., expansionary, conservative, or neutral)?", options:["Risk tolerance","Risk threshold","Risk appetite","Risk register"], answer:2, explain:"Risk appetite is the organization's general stance on risk-taking; risk tolerance is the specific acceptable level for a given risk."},
{domain:5, sub:"5.3", q:"Which agreement type establishes the overall terms governing future work, allowing individual projects to be added through smaller agreements without renegotiating everything?", options:["NDA","MSA","MOU","BPA"], answer:1, explain:"A Master Service Agreement (MSA) sets foundational terms, with specific engagements defined later via a Statement of Work (SOW)."},
{domain:5, sub:"5.3", q:"A contract clause giving your organization the right to directly inspect a vendor's security practices is called a:", options:["Right-to-audit clause","Conflict-of-interest clause","Due diligence clause","Attestation clause"], answer:0, explain:"A right-to-audit clause explicitly grants the ability to inspect or audit the vendor's practices."},
{domain:5, sub:"5.4", q:"Under privacy regulations, what is the individual whose personal data is being collected or processed called?", options:["Data owner","Data subject","Data custodian","Data processor"], answer:1, explain:"The data subject is the individual the personal data is about."},
{domain:5, sub:"5.4", q:"What does the 'right to be forgotten' allow an individual to do?", options:["Access their credit report for free","Request that an organization delete their personal data","Sue for damages after a breach","Opt out of all marketing emails only"], answer:1, explain:"The right to be forgotten (notably under GDPR) lets individuals request deletion of their personal data."},
{domain:5, sub:"5.5", q:"Which type of audit is conducted by a government or regulatory body to verify compliance with specific laws?", options:["Internal audit","Regulatory audit","Self-assessment","Independent third-party audit"], answer:1, explain:"Regulatory audits are conducted directly by government or regulatory bodies."},
{domain:5, sub:"5.5", q:"Gathering information about a target without directly interacting with it (e.g., public records, OSINT) is called:", options:["Active reconnaissance","Passive reconnaissance","Integrated testing","Attestation"], answer:1, explain:"Passive reconnaissance avoids direct interaction with the target, making it harder to detect."},
{domain:5, sub:"5.6", q:"An employee with valid credentials logs in at 3 a.m. from a location they've never used before. What type of anomalous behavior does this represent?", options:["Risky","Unintentional","Unexpected","Compliant"], answer:2, explain:"This deviates from the user's normal pattern, making it 'unexpected' behavior that may indicate a compromised account."},
{domain:5, sub:"5.6", q:"Why is recurring security awareness training necessary in addition to initial onboarding training?", options:["It's required only for new hires","It keeps awareness current as threats and tactics evolve over time","It replaces the need for a written policy","It's only needed for IT staff"], answer:1, explain:"Threats evolve, so ongoing refresher training keeps employees prepared for current tactics, not just what existed at hire."}
];

let currentQuestions = [];
let score = {checked:0, correct:0};

function shuffleArray(arr){
  const a = [...arr];
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

function domainCount(id){
  return QUESTIONS.filter(q=>q.domain===id).length;
}

function buildDomainGrid(){
  const grid = document.getElementById('domainGrid');
  DOMAINS.forEach(d=>{
    const row = document.createElement('label');
    row.className = 'domain-row';
    row.innerHTML = `<input type="checkbox" data-domain="${d.id}" checked>
      <span class="dlabel">${d.label}<br><span style="color:var(--text-dim);font-size:11px;">Covers ${d.covers}</span></span>
      <span class="dcount">${domainCount(d.id)} Qs</span>`;
    grid.appendChild(row);
    const cb = row.querySelector('input');
    row.classList.add('checked');
    cb.addEventListener('change', ()=>{
      row.classList.toggle('checked', cb.checked);
    });
    row.addEventListener('click', (e)=>{
      if(e.target.tagName !== 'INPUT'){
        cb.checked = !cb.checked;
        row.classList.toggle('checked', cb.checked);
      }
    });
  });
}

document.getElementById('selectAllBtn').onclick = ()=>{
  document.querySelectorAll('#domainGrid input').forEach(cb=>{
    cb.checked = true;
    cb.closest('.domain-row').classList.add('checked');
  });
};
document.getElementById('selectNoneBtn').onclick = ()=>{
  document.querySelectorAll('#domainGrid input').forEach(cb=>{
    cb.checked = false;
    cb.closest('.domain-row').classList.remove('checked');
  });
};

function getSelectedDomains(){
  return [...document.querySelectorAll('#domainGrid input:checked')].map(cb=>parseInt(cb.dataset.domain));
}

function domainLabelFor(id){
  const d = DOMAINS.find(x=>x.id===id);
  return d ? `Domain ${d.id} (${d.covers})` : "";
}

document.getElementById('generateBtn').onclick = ()=>{
  const selected = getSelectedDomains();
  if(selected.length === 0){
    alert("Select at least one domain first.");
    return;
  }
  let pool = QUESTIONS.filter(q=>selected.includes(q.domain));
  const shuffle = document.getElementById('shuffleCheck').checked;
  if(shuffle) pool = shuffleArray(pool);
  const countVal = document.getElementById('countSelect').value;
  if(countVal !== 'all'){
    pool = pool.slice(0, parseInt(countVal));
  }
  currentQuestions = pool;
  score = {checked:0, correct:0};
  document.getElementById('setupArea').classList.add('hidden');
  document.getElementById('examArea').style.display = 'block';
  renderExam();
};

document.getElementById('backToSetupBtn').onclick = ()=>{
  document.getElementById('examArea').style.display = 'none';
  document.getElementById('setupArea').classList.remove('hidden');
};

document.getElementById('resetExamBtn').onclick = ()=>{
  score = {checked:0, correct:0};
  renderExam();
};

function updateScore(){
  document.getElementById('scoreLabel').textContent = score.correct + '/' + score.checked;
}

function buildQuestionCard(q, idx){
  const card = document.createElement('div');
  card.className = 'qcard';

  const head = document.createElement('div');
  head.className = 'qhead';
  head.innerHTML = `<span class="qnum">Question ${idx+1} of ${currentQuestions.length}</span><span class="qdomain">${domainLabelFor(q.domain)} · ${q.sub}</span>`;
  card.appendChild(head);

  const qtext = document.createElement('div');
  qtext.className = 'qtext';
  qtext.textContent = q.q;
  card.appendChild(qtext);

  const optList = document.createElement('div');
  optList.className = 'opt-list';
  let selectedIdx = null;
  q.options.forEach((optText, i)=>{
    const opt = document.createElement('div');
    opt.className = 'opt';
    opt.innerHTML = `<span class="marker"></span><span>${optText}</span>`;
    opt.onclick = ()=>{
      [...optList.children].forEach(c=>c.classList.remove('selected'));
      opt.classList.add('selected');
      selectedIdx = i;
    };
    optList.appendChild(opt);
  });
  card.appendChild(optList);

  const actions = document.createElement('div');
  actions.className = 'actions';
  const checkBtn = document.createElement('button');
  checkBtn.className = 'btn-check';
  checkBtn.textContent = 'Check answer';
  actions.appendChild(checkBtn);
  card.appendChild(actions);

  const result = document.createElement('div');
  result.className = 'result';
  result.innerHTML = `<div class="verdict"></div><div class="explain">${q.explain}</div>`;
  card.appendChild(result);

  let checkedOnce = false;
  checkBtn.onclick = ()=>{
    if(selectedIdx === null){
      alert("Pick an answer first.");
      return;
    }
    [...optList.children].forEach((c,i)=>{
      c.classList.remove('selected');
      if(i === q.answer) c.classList.add('correct');
      else if(i === selectedIdx) c.classList.add('incorrect');
    });
    const isCorrect = selectedIdx === q.answer;
    result.classList.add('show');
    result.classList.toggle('pass', isCorrect);
    result.classList.toggle('fail', !isCorrect);
    result.querySelector('.verdict').textContent = isCorrect ? 'Correct!' : 'Not quite.';
    if(!checkedOnce){
      checkedOnce = true;
      score.checked++;
      if(isCorrect) score.correct++;
      updateScore();
    }
  };

  return card;
}

function renderExam(){
  const wrap = document.getElementById('questions');
  wrap.innerHTML = '';
  currentQuestions.forEach((q, i)=>{
    wrap.appendChild(buildQuestionCard(q, i));
  });
  updateScore();
}

buildDomainGrid();
</script>
